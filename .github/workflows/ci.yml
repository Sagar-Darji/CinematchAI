name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build (tsc + vite)
        run: npm run build

  backend:
    name: Backend — syntax + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps for smoke
        # We don't install requirements-aws.txt in CI (heavy: torch-free but
        # large). The smoke test only exercises the auth + watchlist + history
        # routes, which need fastapi, pydantic, jose, and slowapi.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 pydantic==2.10.4 pydantic-settings==2.7.0 \
            "python-jose[cryptography]==3.3.0" bcrypt==4.2.0 starlette \
            slowapi==0.1.9 httpx==0.27.0 pytest==8.3.0 \
            python-dotenv loguru pyyaml requests
      - name: Syntax check
        run: |
          python -m compileall -q src
      - name: Smoke tests
        env:
          DEPLOYMENT_ENV: development
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
        run: pytest tests/test_smoke.py -q
