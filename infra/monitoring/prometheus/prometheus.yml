global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cinematch

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── FastAPI /metrics ─────────────────────────────────────────────────────────
  - job_name: cinematch-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Prometheus self-metrics ──────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
