server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker container logs ─────────────────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Drop containers without the "cinematch" tag prefix
      - source_labels: [__meta_docker_container_name]
        regex: /cinematch-.*
        action: keep
      # Use container name as the "app" label
      - source_labels: [__meta_docker_container_name]
        target_label: app
        regex: /(.+)
        replacement: $1
      # Pass through Docker log stream label
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Try to parse JSON logs (from LOG_FORMAT=json containers)
      - json:
          expressions:
            level: level
            logger: logger
            message: message
      - labels:
          level:
          logger:
      # Fall back: keep raw line as-is if JSON parsing fails
      - output:
          source: message
