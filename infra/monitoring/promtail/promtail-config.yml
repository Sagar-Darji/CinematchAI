# ── Promtail — Linux bare-metal only ─────────────────────────────────────────
#
# This config is for running CinematchAI on a Linux host (e.g. a VPS / CI server)
# where /var/lib/docker/containers is directly accessible.
#
# On macOS Docker Desktop, that path lives inside a VM and is NOT readable by
# Promtail on the host.  Use the Loki Docker driver plugin instead:
#
#   make plugin   # installs grafana/loki-docker-driver once
#   make up       # docker-compose uses `driver: loki` on api + frontend
#
# To use THIS file on Linux:
#   1. Uncomment the promtail service in docker-compose.yml
#   2. Change api/frontend logging driver back to json-file
# ─────────────────────────────────────────────────────────────────────────────

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only containers whose name starts with /cinematch-
      - source_labels: [__meta_docker_container_name]
        regex: /cinematch-.*
        action: keep
      # Use container name as the "app" label
      - source_labels: [__meta_docker_container_name]
        target_label: app
        regex: /(.+)
        replacement: $1
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Parse JSON fields emitted by LOG_FORMAT=json
      - json:
          expressions:
            level: level
            logger: logger
            message: message
      - labels:
          level:
          logger:
      - output:
          source: message
