apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinematch-frontend
  namespace: cinematch
  labels:
    app: cinematch-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinematch-frontend
  template:
    metadata:
      labels:
        app: cinematch-frontend
    spec:
      containers:
        - name: frontend
          image: cinematch-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: cinematch-frontend
  namespace: cinematch
  labels:
    app: cinematch-frontend
spec:
  selector:
    app: cinematch-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
