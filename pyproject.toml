[tool.poetry]
name = "cinematch-ai"
version = "1.0.0"
description = "Multi-Agent Movie Recommendation System with Explainable AI"
authors = ["Sagar Darji"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.3.13"
langchain-groq = "^0.2.1"
langgraph = "^0.2.60"
sentence-transformers = "^3.3.1"
transformers = "^4.47.1"
torch = "^2.5.1"
chromadb = "^0.5.23"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.4"
pydantic-settings = "^2.7.0"
streamlit = "^1.41.1"
pandas = "^2.2.3"
numpy = "^2.2.1"
pyarrow = "^18.1.0"
Pillow = "^11.0.0"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.2"
requests = "^2.32.3"
aiohttp = "^3.11.11"
python-multipart = "^0.0.20"
diskcache = "^5.6.3"
loguru = "^0.7.3"
slowapi = "^0.1.9"
tmdbsimple = "^2.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.14.1"
ruff = "^0.8.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
