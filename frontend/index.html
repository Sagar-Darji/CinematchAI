    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport: cover for iPhone notch, no user scaling -->

    <!-- PWA / iOS Add-to-Home-Screen -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="description" content="Discover your next favorite movie with AI-powered personalized recommendations. Track what you've watched and find hidden gems." />

    <!-- Open Graph (link previews: WhatsApp, iMessage, Slack, etc.) -->

    <meta property="og:description" content="Discover your next favorite movie with AI-powered personalized recommendations. Track what you've watched and find hidden gems." />
