<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b20710;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Film strip frame -->
  <rect x="25" y="30" width="50" height="40" fill="none" stroke="white" stroke-width="3" rx="3"/>
  
  <!-- Film strip holes -->
  <circle cx="25" cy="35" r="2" fill="white"/>
  <circle cx="25" cy="50" r="2" fill="white"/>
  <circle cx="25" cy="65" r="2" fill="white"/>
  <circle cx="75" cy="35" r="2" fill="white"/>
  <circle cx="75" cy="50" r="2" fill="white"/>
  <circle cx="75" cy="65" r="2" fill="white"/>
  
  <!-- Play button / AI spark -->
  <path d="M 45 40 L 45 60 L 60 50 Z" fill="white"/>
  
  <!-- AI neural connection dots -->
  <circle cx="35" cy="45" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="40" cy="55" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="60" cy="45" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="65" cy="55" r="1.5" fill="white" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="35" y1="45" x2="45" y2="45" stroke="white" stroke-width="0.5" opacity="0.5"/>
  <line x1="40" y1="55" x2="45" y2="55" stroke="white" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="45" x2="60" y2="50" stroke="white" stroke-width="0.5" opacity="0.5"/>
  <line x1="65" y1="55" x2="60" y2="55" stroke="white" stroke-width="0.5" opacity="0.5"/>
</svg>
